<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco-Guardian: 12 ผู้พิทักษ์ระบบนิเวศ ม.3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #0b132b; color: #f8fafc; }
    .font-tech { font-family: 'Chakra Petch', sans-serif; }
    .hp-bar-transition { transition: width 0.4s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20%, 60% { transform: translate(-8px, 4px); }
      40%, 80% { transform: translate(8px, -4px); }
    }
    .shake-effect { animation: shake 0.4s ease-in-out; }
    @media print {
      body * { visibility: hidden; }
      #cert-print-area, #cert-print-area * { visibility: visible; }
      #cert-print-area {
        position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
        margin: 0; padding: 20px; box-sizing: border-box; background: white !important;
        display: flex !important; align-items: center; justify-content: center;
      }
      @page { size: A4 landscape; margin: 0; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 md:p-6 bg-slate-950 text-slate-100">

  <!-- Header & Status -->
  <header class="w-full max-w-4xl flex items-center justify-between mb-4 bg-slate-900/80 p-4 rounded-2xl border border-emerald-500/30 backdrop-blur shadow-lg shadow-emerald-950/20">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-xl shadow-md shadow-emerald-500/20">🌱</div>
      <div>
        <h1 class="text-lg md:text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent font-tech tracking-wider">ECO-GUARDIAN ม.3</h1>
        <p class="text-xs text-slate-400">สสวท. วิทยาศาสตร์ 12 ภารกิจพิทักษ์สมดุลโลก</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div id="cloud-pill" class="text-xs font-tech bg-slate-800 text-slate-400 px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-slate-500 animate-pulse"></span>
        <span id="cloud-pill-text">ออฟไลน์</span>
      </div>
      <button id="sound-btn" onclick="toggleSound()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 text-xs">🔊 เสียง: เปิด</button>
    </div>
  </header>

  <!-- Login Modal / Screen -->
  <div id="login-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-emerald-500/40 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl relative">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3">🛡️</div>
        <h2 class="text-2xl font-bold text-white font-tech">เข้าสู่ระบบผู้พิทักษ์</h2>
        <p class="text-xs text-slate-400 mt-1">กรอกรหัสนักเรียนเพื่อโหลดคะแนนและด่านที่เล่นค้างไว้</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-emerald-400 mb-1">รหัสประจำตัวนักเรียน</label>
          <input type="text" id="input-student-id" placeholder="เช่น 10001" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white font-tech focus:border-emerald-500 focus:outline-none">
        </div>
        <div id="extra-info-box" class="space-y-3 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">ชื่อ - นามสกุล</label>
            <input type="text" id="input-student-name" placeholder="ด.ช. รักษ์โลก ใจดี" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-white focus:border-emerald-500 focus:outline-none text-sm">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">ห้อง (ชั้น ม.3/...)</label>
              <input type="text" id="input-student-room" placeholder="ม.3/1" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-white focus:border-emerald-500 focus:outline-none text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">เลขที่</label>
              <input type="number" id="input-student-no" placeholder="1" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-white focus:border-emerald-500 focus:outline-none text-sm">
            </div>
          </div>
        </div>
        <button id="btn-login" onclick="handleLogin()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition-all font-tech tracking-wider mt-2">
          เข้าสู่เกม 🚀
        </button>
      </div>
    </div>
  </div>

  <!-- Stage Map / Selector -->
  <main id="view-map" class="w-full max-w-4xl space-y-6">
    <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-emerald-400">👤</div>
        <div>
          <div class="flex items-center gap-2">
            <span id="player-display-name" class="font-bold text-sm text-white">ผู้พิทักษ์ฝึกหัด</span>
            <span id="player-display-info" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md font-tech">ม.3</span>
          </div>
          <p class="text-xs text-slate-400 mt-0.5">คะแนนสะสม: <span id="total-score-badge" class="font-tech text-emerald-400 font-bold text-sm">0</span> / 65</p>
        </div>
      </div>
      <button onclick="checkFinalResult()" class="px-4 py-2 bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 text-slate-950 font-bold rounded-xl text-xs font-tech shadow-md shadow-emerald-500/10">
        🏆 ตรวจสอบเกียรติบัตร
      </button>
    </div>

    <!-- 12 Stages Grid -->
    <div id="stages-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <!-- Battle View -->
  <main id="view-battle" class="w-full max-w-4xl hidden space-y-4">
    <div class="flex items-center justify-between bg-slate-900/60 px-4 py-2 rounded-xl border border-slate-800">
      <button onclick="returnToMap()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 font-tech">
        ← กลับแผนที่ด่าน
      </button>
      <div id="battle-stage-title" class="text-xs font-bold text-emerald-400 font-tech">ด่านที่ 1: ระบบนิเวศรอบตัวเรา</div>
      <div id="battle-q-counter" class="text-xs font-tech text-slate-400">ข้อที่ 1/5</div>
    </div>

    <div id="arena-card" class="bg-gradient-to-b from-slate-900 to-slate-950 rounded-3xl p-6 border border-slate-800 shadow-2xl relative overflow-hidden">
      <div class="grid grid-cols-2 gap-4 items-center mb-6">
        <!--
